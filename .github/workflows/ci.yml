name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install locked documentation parsers
        run: npm ci --prefix tools/docs --ignore-scripts
      - name: Links, ownership, ABI prose and Mermaid syntax
        run: python3 tools/check_docs.py
      - name: Adversarial documentation fixtures
        run: python3 -B tools/test_check_docs.py
      - name: PTY observer exit ordering
        run: python3 -B tools/test_c_pty.py
      - name: Fragmented analysis observer receipts
        run: python3 -B tools/test_analysis_pty.py
      - name: Generated ABI declarations stay authoritative
        run: python3 tools/generate_abi.py --check
      - name: Check repository stayed unchanged
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_NET_OFFLINE: "true"
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Record toolchain
        run: |
          rustc --version --verbose
          cargo --version
      - name: Fetch locked dependencies
        env:
          CARGO_NET_OFFLINE: "false"
        run: cargo fetch --locked
      - run: cargo fmt --check
      - run: cargo check --workspace --all-targets
      - name: Rust core and public boundary
        run: cargo test --workspace --lib --test core --test foundation --test architecture --test document
      - name: Rust PTY behavior
        run: cargo test -p replai --test pty
      - name: Rust release regressions
        run: cargo test --workspace --release
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --doc
      - name: Check tracked files stayed unchanged
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"

  native:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt
      - name: Install native qualification tools
        run: sudo apt-get update && sudo apt-get install -y valgrind pkg-config g++
      - name: Release C ABI, staging, layout and C11/C++17 headers
        run: python3 tools/qualify_c.py --work "$RUNNER_TEMP/replai-native" --phase prepare
      - name: External static C consumer, misuse, descriptors and PTY behavior
        run: python3 tools/qualify_c.py --work "$RUNNER_TEMP/replai-native" --phase static
      - name: External shared C consumer, misuse, descriptors and PTY behavior
        run: python3 tools/qualify_c.py --work "$RUNNER_TEMP/replai-native" --phase shared
      - name: Memory and leak qualification with Valgrind
        run: python3 tools/qualify_c.py --work "$RUNNER_TEMP/replai-native" --phase memory
      - name: Symbols, staged loader resolution and installed metadata
        run: python3 tools/qualify_c.py --work "$RUNNER_TEMP/replai-native" --phase audit
      - name: Check repository stayed unchanged
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

  portable-engine:
    name: Portable engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: clippy
      - name: Record native platform and compiler
        run: rustc --version --verbose
      - name: Fetch locked dependencies for offline cross-target foundation audit
        run: cargo fetch --locked
      - name: Compile platform-neutral public library
        run: cargo check --locked -p replai --lib
      - name: Deterministic engine, protocol, layout and virtual transport conformance
        run: cargo test --locked -p replai --lib --test core --test architecture --test unicode_model --test document --test analysis
      - name: Native library lint and documentation
        run: |
          cargo clippy --locked -p replai --lib -- -D warnings
          cargo test --locked -p replai --doc
      - name: Real macOS Rust terminal lifecycle and release PTYs
        if: runner.os == 'macOS'
        run: |
          cargo test --locked --workspace --all-targets
          cargo test --locked --workspace --release

  embedding:
    name: External embedding (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Blocking and host reactor real PTYs, deadlines, resize and resources
        run: python3 tools/embedding_pty.py --work "$RUNNER_TEMP/replai-embedding"
      - name: Revision-bound delayed analysis through a real external reactor
        run: python3 tools/analysis_pty.py --work "$RUNNER_TEMP/replai-analysis"
      - name: Capability profiles with real native resources
        run: cargo test --locked --test capabilities_pty -- --nocapture
      - name: Install Linux embedding memory tool
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Real reactor lifecycle under native memory tooling
        run: python3 tools/embedding_pty.py --memory --work "$RUNNER_TEMP/replai-embedding-memory"
      - name: Retain exact embedding observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: embedding-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/replai-embedding
            ${{ runner.temp }}/replai-embedding-memory
            ${{ runner.temp }}/replai-analysis

  native-macos:
    name: macOS C ABI and real terminal
    runs-on: macos-latest
    env:
      RUSTFLAGS: -D warnings
      RUSTDOCFLAGS: -D warnings
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Native C tools
        run: command -v pkg-config || brew install pkg-config
      - name: Static/dylib C ABI, C++17, real PTYs, ownership and native leaks
        run: python3 tools/qualify_c.py --work "$RUNNER_TEMP/replai-native-macos"
      - name: Check repository stayed unchanged
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

  benchmark-integrity:
    name: Benchmark integrity (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Compile, execute, validate separate timing and allocation smoke modes
        run: python tools/perf/smoke.py
      - name: Validate committed characterization evidence
        run: |
          python tools/perf/results.py validate docs/engineering/analysis-protocol/before.json
          python tools/perf/results.py validate docs/engineering/analysis-protocol/after.json
          python tools/perf/results.py validate docs/engineering/p0/components.json
          python tools/perf/results.py validate docs/engineering/p0/systems.json
          python tools/perf/results.py validate docs/engineering/p0/output-comparison.json
          python tools/perf/results.py validate docs/engineering/macos-perf/before.json
          python tools/perf/results.py validate docs/engineering/macos-perf/after.json
          python tools/perf/results.py validate docs/engineering/macos-perf/editor.json
          python tools/perf/results.py validate docs/engineering/macos-perf/layout.json
          python tools/perf/results.py validate docs/engineering/macos-perf/buffered.json
          python tools/perf/results.py validate docs/engineering/macos-perf/probe-delay.json
          python tools/perf/results.py validate docs/engineering/macos-perf/visible-flush.json
          python tools/perf/results.py validate docs/engineering/macos-perf/driver-before.json
      - name: Benchmark fixture lint
        run: cargo clippy --locked --manifest-path tools/perf/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Real POSIX PTY harness smoke (no latency threshold)
        if: runner.os != 'Windows'
        run: |
          python3 tools/perf/linux.py --smoke --work "$RUNNER_TEMP/replai-performance-pty"
          python3 tools/perf/driver.py --repeats 1 --work "$RUNNER_TEMP/replai-driver-counts"
      - name: Compile pinned comparison fixtures and exercise overlapping PTY cases
        if: runner.os != 'Windows'
        run: |
          python3 tools/perf/run.py --prepare --families comparisons --work "$RUNNER_TEMP/replai-comparison-build"
          python3 tools/perf/compare.py --smoke --work "$RUNNER_TEMP/replai-comparison-smoke"
      - name: Check tracked and untracked files stayed unchanged
        run: python -c "import subprocess; assert not subprocess.check_output(['git','status','--porcelain']).strip()"
