name: Release hardening native campaign
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x86_64
          - os: ubuntu-24.04-arm
            architecture: aarch64
          - os: macos-15
            architecture: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - name: Require exact native architecture
        run: |
          test "$(uname -m)" = '${{ matrix.architecture }}'
          uname -a
          rustc -vV
      - name: Linux memory tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Counted native lifecycle, mixed events and resource failures
        run: python3 tools/hardening/native.py --work "$RUNNER_TEMP/replai-hardening-native"
      - name: Counted native paths under memory instrumentation
        run: python3 tools/hardening/native.py --memory --work "$RUNNER_TEMP/replai-hardening-memory"
      - name: Preserve campaign receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hardening-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/replai-hardening-native
            ${{ runner.temp }}/replai-hardening-memory
