name: Interaction ergonomics native qualification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x86_64
          - os: ubuntu-24.04-arm
            architecture: aarch64
          - os: macos-15
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - name: Require the selected native architecture
        run: |
          test "$(uname -m)" = '${{ matrix.architecture }}'
          uname -a
          rustc -vV
      - name: Install Linux memory tooling
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Portable model, real PTY and native memory qualification
        run: python3 tools/ergonomics/qualify_native.py --work "$RUNNER_TEMP/replai-ergonomics"
      - name: Replay retained feature corpus
        run: python3 tools/ergonomics/corpus.py replay --archive tools/ergonomics/editor-corpus.json.gz --work "$RUNNER_TEMP/replai-ergonomics-corpus"
      - name: Retain exact receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interaction-ergonomics-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/replai-ergonomics
            ${{ runner.temp }}/replai-ergonomics-corpus

  windows-portable:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.98.1'
      - name: Portable editor/model qualification
        run: python tools/ergonomics/qualify_native.py --portable-only --work "$env:RUNNER_TEMP/replai-ergonomics"
      - name: Replay retained feature corpus
        run: python tools/ergonomics/corpus.py replay --archive tools/ergonomics/editor-corpus.json.gz --work "$env:RUNNER_TEMP/replai-ergonomics-corpus"
      - name: Retain exact receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interaction-ergonomics-windows-2025
          path: |
            ${{ runner.temp }}/replai-ergonomics
            ${{ runner.temp }}/replai-ergonomics-corpus
