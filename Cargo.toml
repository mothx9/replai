[package]
name = "replai"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
description = "Terminal interaction engine with Unicode editing and revision-safe host analysis"
license = "MIT"
repository = "https://github.com/mothx9/replai"
documentation = "https://docs.rs/replai"
readme = "README.md"
keywords = ["terminal", "repl", "line-editor", "unicode", "cli"]
categories = ["command-line-interface", "development-tools"]
publish = ["crates-io"]
build = false
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
    "/src/**/*.rs",
    "/examples/**/*.rs",
    "/examples/c/demo.c",
    "/tests/**/*.rs",
    "/tests/fixtures/presentation.tsv",
    "/include/replai.h",
    "/api/c-abi.json",
    "/docs/*.md",
    "/docs/engineering/release-hardening.md",
    "/assets/replai-lockup-dark.svg",
    "/assets/replai-lockup-light.svg",
    "/assets/terminal-report.png",
    "/assets/terminal-results.png",
    "/assets/readme/architecture-dark.svg",
    "/assets/readme/architecture-light.svg",
    "/assets/readme/benchmark-q2.svg",
    "/assets/readme/terminal-showcase.gif",
    "/assets/readme/terminal-showcase.png",
]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = [
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "warn"

[dependencies]
unicode-segmentation = "1.13.3"
unicode-width = { version = "0.2.2", default-features = false }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "1.1.4", features = ["termios", "event", "fs"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
rustix = { version = "1.1.4", features = ["pty"] }

[dev-dependencies]
vt100 = "0.16.2"

[workspace]
members = ["crates/replai-c"]
default-members = [".", "crates/replai-c"]
resolver = "3"

[profile.release]
panic = "unwind"
debug = 1

[[example]]
name = "terminal-state"
path = "tests/support/terminal_state.rs"

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["event", "poll"] }
