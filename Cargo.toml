[package]
name = "replai"
version = "0.1.0-dev.0"
edition = "2024"
description = "Embeddable terminal interaction library for line-oriented and REPL-style interfaces"
license = "MIT"
repository = "https://github.com/mothx9/replai"
readme = "README.md"
publish = false
build = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "warn"

[dependencies]
unicode-segmentation = "1.13.3"
unicode-width = { version = "0.2.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", features = ["termios", "event", "fs"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1.1.4", features = ["pty"] }

[dev-dependencies]
vt100 = "0.16.2"

[workspace]
members = ["crates/replai-c"]
default-members = [".", "crates/replai-c"]
resolver = "3"

[profile.release]
panic = "unwind"
debug = 1

[[example]]
name = "terminal-state"
path = "tests/support/terminal_state.rs"
