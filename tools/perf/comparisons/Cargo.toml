[package]
name = "replai-comparisons"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
rustyline = { git = "https://github.com/kkawakam/rustyline", rev = "1d1aa2f43a8f08092bc925c0cac4afc2a2772b11", default-features = false }
reedline = { git = "https://github.com/nushell/reedline", rev = "3eb99426d4399b18b11a2cf4b5b5fff8c1b404e9", default-features = false }
[[bin]]
name = "rustyline-host"
path = "rustyline.rs"
[[bin]]
name = "reedline-host"
path = "reedline.rs"
[profile.release]
debug = 1
panic = "unwind"
