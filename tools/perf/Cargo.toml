[package]
name = "replai-performance"
version = "0.1.0"
edition = "2024"
publish = false

# Isolated development fixture, never a REPLAI dependency or public API.
[workspace]

[features]
allocations = []

[dependencies]
replai = { path = "../.." }
unicode-segmentation = "=1.13.3"
unicode-width = { version = "=0.2.2", default-features = false }
serde_json = "1"
vt100 = "=0.16.2"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["termios", "event", "fs", "pty"] }

[[bin]]
name = "components"
path = "components.rs"

[[bin]]
name = "pty-host"
path = "pty_host.rs"

[profile.release]
debug = 1
panic = "unwind"
